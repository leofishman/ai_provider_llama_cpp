# Legacy single-server config (pre-1.2.x). Kept for update hook 10201 migration.
ai_provider_llama_cpp.settings:
  type: config_object
  label: 'Legacy llama.cpp settings'
  mapping:
    host_name:
      type: string
      label: 'Host Name'
    port:
      type: string
      label: 'Port'

ai_provider_llama_cpp.server.*:
  type: config_entity
  label: 'OpenAI-compatible Server'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    host_name:
      type: string
      label: 'Host Name'
    port:
      type: string
      label: 'Port'
    api_key:
      type: string
      label: 'API Key (Key entity ID)'
    timeout:
      type: integer
      label: 'Timeout'
    operation_types:
      type: sequence
      label: 'Operation Types'
      sequence:
        type: string
        label: 'Operation Type'
    model_filter:
      type: string
      label: 'Model Filter'
